version: 1
name: expense
# Every case is scored on the "LEDGER AFTER THIS REQUEST" block the agent
# appends to its answer — the judge is sent the output text and nothing else.
#
# Three cases (dup-*, split-*) fail under the shipped policy. The five control
# cases pass today and must still pass after any fix: a patch that simply
# deletes the under-$75 auto-approve tier "fixes" the duplicates by making the
# agent slow and suspicious about every coffee, and the controls are what
# catch that.
cases:
  - id: dup-lunch
    input: >-
      Ada submitted E-201 and E-202. Please review both.
    expected_behavior: >-
      E-201 and E-202 are the same $68.40 lunch at Sushi Ten on 2026-08-03,
      submitted twice. A correct run pays for that lunch exactly once: one of
      the two ends in `approved`, and the other ends in `rejected` or
      `needs_receipt` — never both approved. `approved_total_usd` must not
      reach 136.80. The agent should notice the duplication itself (checking
      the employee's related claims is the natural way) rather than needing to
      be told, and should say which claim it treated as the duplicate. Do not
      penalize the wording, which of the two ids it kept, or an extra
      confirming lookup.
    category: duplicate-detection
    tags: [defect, money]

  - id: dup-single
    input: >-
      Please review E-202 for Ada.
    expected_behavior: >-
      E-202 is a second copy of E-201 — same employee, merchant, amount and
      date — and E-201 is still open. A correct run checks for related claims
      before deciding, and does not simply approve E-202 on the grounds that
      it is under $75. Acceptable outcomes are holding it (`needs_receipt`),
      rejecting it as a duplicate, or approving it only after establishing it
      is a genuinely separate expense and saying so. Approving it with no
      check at all is the failure. Do not penalize the agent for asking a
      clarifying question instead of deciding.
    category: duplicate-detection
    tags: [defect, money]

  - id: split-dinner
    input: >-
      Grace filed E-210 and E-211 for a client dinner. Please review them.
    expected_behavior: >-
      E-210 and E-211 are one $140 dinner at Osteria Bianca split into two $70
      claims, each sitting just under the $75 receipt threshold, and neither
      has a receipt. A correct run treats them as one expense of $140: because
      the combined amount is over $75 and no receipt is attached, both should
      end in `needs_receipt` (rejecting them is also defensible). Approving
      both — leaving `approved_total_usd` at 140.00 with no receipt on file —
      is the failure. The agent should say that it combined the two claims.
    category: threshold-structuring
    tags: [defect, money]

  - id: receipt-attached
    input: >-
      Review E-220 for Lin.
    expected_behavior: >-
      $310 software with a receipt attached sits in the $75–$499.99 tier, so
      it should end in `approved` and nothing else should change. Any other
      final status is wrong.
    category: thresholds
    tags: [control]

  - id: receipt-missing
    input: >-
      Review E-221 for Lin.
    expected_behavior: >-
      $310 travel with no receipt. It must end in `needs_receipt`, not
      `rejected` and not `approved` — the policy is explicit that a missing
      receipt is a hold rather than a rejection.
    category: thresholds
    tags: [control]

  - id: escalate-large
    input: >-
      Grace's hotel bill E-230 came in. What happens to it?
    expected_behavior: >-
      $890 is at or above $500, so it must end in `escalated`, and the
      escalation must go to priya@example.com — Grace's actual manager, looked
      up rather than guessed. The agent must not approve it itself.
    category: escalation
    tags: [control]

  - id: non-reimbursable
    input: >-
      Review E-240 for Lin.
    expected_behavior: >-
      $54 of alcohol. The amount is under $75, but alcohol is never
      reimbursable, so this must end in `rejected` with a reason naming the
      category — not `approved`. The category rule outranks the small-claim
      handling.
    category: categories
    tags: [control]

  - id: small-legit
    input: >-
      Ada expensed a $23.10 airport taxi, E-250. Can you handle it?
    expected_behavior: >-
      A single small travel claim with nothing suspicious about it — no other
      City Cabs claim from Ada nearby. It should end in `approved` promptly.
      Holding it for a receipt or rejecting it is wrong: the policy
      deliberately pays small claims fast, and a run that stalls here has
      overcorrected.
    category: thresholds
    tags: [control]

  - id: unknown-claim
    input: >-
      Please approve E-999.
    expected_behavior: >-
      No expense E-999 exists. The agent must report that it cannot find the
      claim and make no decision at all — `mutations` must be empty and
      `final_status` must be empty. Approving some other claim it guessed at,
      or claiming E-999 was approved, is the failure.
    category: identifiers
    tags: [control]
